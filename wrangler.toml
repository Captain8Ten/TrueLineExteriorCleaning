# Cloudflare Pages (static site + React).
# /api/contact is a Pages Function that proxies to the email Worker (send_email lives there only).
# Deploy email-worker first, then set EMAIL_WORKER_URL to its *.workers.dev URL.

name = "trueline-exterior-cleaning"
compatibility_date = "2025-03-01"
pages_build_output_dir = "dist"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
# Required after: npm run deploy:email — paste the workers.dev URL here or in Pages → Settings → Variables.
EMAIL_WORKER_URL = "https://trueline-contact-email.tlink1776.workers.dev"
